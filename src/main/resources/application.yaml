# CI/CD Reliability AI Agent - Phase 1
# Every value can be overridden with an environment variable (see .env.example). No credentials here.

spring:
  application:
    name: hackathon-ai-agent
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cicd_agent}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

monitoring:
  enabled: ${MONITORING_ENABLED:true}
  polling-interval-ms: ${MONITORING_POLLING_INTERVAL_MS:15000}
  initial-delay-ms: ${MONITORING_INITIAL_DELAY_MS:5000}
  # Comma-separated list of namespaces to monitor.
  namespaces: ${MONITORING_NAMESPACES:default}
  # Optional Kubernetes label selector, e.g. "app.kubernetes.io/part-of=demo-app".
  label-selector: ${MONITORING_LABEL_SELECTOR:}
  page-size: ${MONITORING_PAGE_SIZE:200}
  tekton:
    group: ${TEKTON_API_GROUP:tekton.dev}
    api-version: ${TEKTON_API_VERSION:v1}

kubernetes:
  # AUTO (kubeconfig if present, else in-cluster ServiceAccount) | KUBECONFIG | IN_CLUSTER
  auth-mode: ${KUBERNETES_AUTH_MODE:AUTO}
  kubeconfig-path: ${KUBERNETES_KUBECONFIG_PATH:}
  context: ${KUBERNETES_CONTEXT:}
  connection-timeout-ms: ${KUBERNETES_CONNECTION_TIMEOUT_MS:5000}
  request-timeout-ms: ${KUBERNETES_REQUEST_TIMEOUT_MS:10000}

# Failure evidence collection (Phase 2.1). Disabled until validated; also requires monitoring.enabled.
evidence:
  enabled: ${EVIDENCE_ENABLED:false}
  polling-interval-ms: ${EVIDENCE_POLLING_INTERVAL_MS:30000}
  initial-delay-ms: ${EVIDENCE_INITIAL_DELAY_MS:20000}
  lookback-hours: ${EVIDENCE_LOOKBACK_HOURS:24}
  batch-size: ${EVIDENCE_BATCH_SIZE:10}
  max-concurrent-log-requests: ${EVIDENCE_MAX_CONCURRENT_LOG_REQUESTS:2}
  max-log-lines: ${EVIDENCE_MAX_LOG_LINES:500}
  max-container-log-bytes: ${EVIDENCE_MAX_CONTAINER_LOG_BYTES:65536}
  max-taskrun-log-bytes: ${EVIDENCE_MAX_TASKRUN_LOG_BYTES:262144}
  retention-days: ${EVIDENCE_RETENTION_DAYS:14}
  max-fetch-attempts: ${EVIDENCE_MAX_FETCH_ATTEMPTS:5}
  retry-backoff-seconds: ${EVIDENCE_RETRY_BACKOFF_SECONDS:60}
  request-timeout-ms: ${EVIDENCE_REQUEST_TIMEOUT_MS:10000}

app:
  cors:
    # Comma-separated list of allowed frontend origins, e.g. http://localhost:4200
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origin-patterns: "*"
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
        max-age: 3600
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UNKNOWN, UP
        http-mapping:
          DEGRADED: 200
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: false

info:
  app:
    name: CI/CD Reliability AI Agent
    description: Tekton pipeline reliability monitoring (Phase 1)
    phase: 1
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /agent/v3/api-docs/swagger-config
    url: /agent/v3/api-docs
    oauth2-redirect-url: /agent/swagger-ui/oauth2-redirect.html
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.hackathon.agent: ${LOG_LEVEL:INFO}
    # Fabric8 logs full request URLs at DEBUG; keep it quiet by default.
    io.fabric8: WARN
  # For JSON logs in the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash / gelf).springdoc:
