# Local development profile: SPRING_PROFILES_ACTIVE=local
# Uses your kubeconfig and a local PostgreSQL. Placeholders only - supply credentials via environment variables.

spring:
  datasource:
    url: ${DB_URL:jdbc:jdbc:postgresql://localhost:15432/reliability_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

kubernetes:
  auth-mode: ${KUBERNETES_AUTH_MODE:KUBECONFIG}
  context: ${KUBERNETES_CONTEXT:}

monitoring:
  namespaces: ${MONITORING_NAMESPACES:default}
  initial-delay-ms: 2000

logging:
  level:
    com.hackathon.agent: DEBUG
